# Docker Compose for wrss local development
# Generated by audit-bot
# Usage: docker-compose up --build

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    container_name: wrss-app
    ports:
      - "[REDACTED:loopback-port]:[REDACTED:loopback-port]"
    environment:
      - HOST=0.0.0.0
      - PORT=[REDACTED:loopback-port]
      - WORKERS=1
      - PYTHONUNBUFFERED=1
    env_file:
      - .env
    volumes:
      # Bind-mount source code for live reload during development
      - .:/app:ro
      # Bind-mount venv if you want to use host-installed packages
      # - ./venv:/app/venv:ro
      # Bind-mount traces directory for llmtrace integration
      - [REDACTED:server-path]:/app/traces:ro
      # Bind-mount project-specific data directories
    user: "${UID:-1000}:${GID:-1000}"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:[REDACTED:loopback-port]/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Optional: Add a test runner service
  test:
    build:
      context: .
      dockerfile: Dockerfile
      target: python-deps
    container_name: wrss-test
    environment:
      - PYTHONUNBUFFERED=1
    env_file:
      - .env.example
    volumes:
      - .:/app:ro
      - ./tests:/app/tests:ro
    command: pytest /app/tests -v
    depends_on:
      - app
    profiles:
      - test

  # Optional: Add a linting service
  lint:
    build:
      context: .
      dockerfile: Dockerfile
      target: python-deps
    container_name: wrss-lint
    volumes:
      - .:/app:ro
    command: |
      sh -c "pip install -q mypy bandit && mypy /app --ignore-missing-imports && bandit -r /app"
    profiles:
      - lint

# Networks
networks:
  default:
    name: wrss-network